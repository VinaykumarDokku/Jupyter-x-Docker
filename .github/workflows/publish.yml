name: Jupyter Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t jupyter-x-docker:test .

      - name: Verify Python installation
        run: docker run --rm --entrypoint python jupyter-x-docker:test --version

      - name: Verify Jupyter installation
        run: docker run --rm --entrypoint jupyter jupyter-x-docker:test --version
